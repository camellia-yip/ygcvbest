<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" width="1110" height="630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1110" height="630" rx="14" fill="#fbfaf7"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1d2430">思路关系图：两条线索、交叉证据、汇合到缺口</text>

  <!-- ===== 线索一：A 框（含 B） ===== -->
  <rect x="30" y="80" width="460" height="170" rx="12" fill="#f3f8f5" stroke="#2f7d4f" stroke-width="1.6"/>
  <rect x="215" y="68" width="262" height="26" rx="13" fill="#2f7d4f"/>
  <text x="346" y="86" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B：三者其实都是「视觉表征」假设 ✅</text>
  <text x="46" y="110" font-size="14" font-weight="700" fill="#1d2430">线索一 · 假设 A：长尾 = 三个能力缺陷</text>

  <g>
    <rect x="46" y="120" width="140" height="80" rx="9" fill="#fff" stroke="#d9dce1"/>
    <text x="60" y="148" font-size="15" font-weight="700" fill="#1d2430">A1 物理</text>
    <rect x="60" y="162" width="72" height="22" rx="11" fill="#eceef1"/><text x="96" y="177" font-size="12" fill="#5b6472" text-anchor="middle">未被证实</text>

    <rect x="191" y="120" width="140" height="80" rx="9" fill="#fff" stroke="#d9dce1"/>
    <text x="205" y="148" font-size="15" font-weight="700" fill="#1d2430">A2 交互</text>
    <rect x="205" y="162" width="72" height="22" rx="11" fill="#e1f2e7"/><text x="241" y="177" font-size="12" fill="#2f7d4f" text-anchor="middle">因果最强</text>

    <rect x="336" y="120" width="140" height="80" rx="9" fill="#fff" stroke="#d9dce1"/>
    <text x="350" y="148" font-size="15" font-weight="700" fill="#1d2430">A3 规则符号</text>
    <rect x="350" y="162" width="96" height="22" rx="11" fill="#fdf1dc"/><text x="398" y="177" font-size="12" fill="#a0640f" text-anchor="middle">识别✗ 遵从✓</text>
  </g>
  <text x="476" y="232" font-size="12" fill="#5b6472" text-anchor="end">长尾难定义、难定位</text>

  <!-- A -> C -->
  <line x1="490" y1="200" x2="543" y2="200" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="517" cy="222" r="11" fill="#c0392b"/><text x="517" y="227" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">①</text>

  <!-- C -->
  <rect x="545" y="105" width="160" height="150" rx="10" fill="#fff" stroke="#d9dce1"/>
  <text x="561" y="130" font-size="12" fill="#7a828e">假设 C</text>
  <text x="561" y="156" font-size="15" font-weight="700" fill="#1d2430">视觉 + LLM = VLA</text>
  <text x="561" y="180" font-size="12" fill="#4a5260">回应 B：视觉不够</text>
  <text x="561" y="198" font-size="12" fill="#4a5260">就加语言</text>
  <rect x="561" y="214" width="72" height="22" rx="11" fill="#fdf1dc"/><text x="597" y="229" font-size="12" fill="#a0640f" text-anchor="middle">部分成立</text>

  <!-- C -> D -->
  <line x1="705" y1="180" x2="743" y2="180" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="724" cy="202" r="11" fill="#c0392b"/><text x="724" y="207" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">②</text>

  <!-- D -->
  <rect x="745" y="105" width="160" height="150" rx="10" fill="#fff" stroke="#d9dce1"/>
  <text x="761" y="130" font-size="12" fill="#7a828e">假设 D</text>
  <text x="761" y="156" font-size="15" font-weight="700" fill="#1d2430">语言 → 动作断裂</text>
  <text x="761" y="180" font-size="12" fill="#4a5260">C 的残余失败：</text>
  <text x="761" y="198" font-size="12" fill="#4a5260">推理对，动作错</text>
  <rect x="761" y="214" width="50" height="22" rx="11" fill="#e1f2e7"/><text x="786" y="229" font-size="12" fill="#2f7d4f" text-anchor="middle">成立</text>

  <!-- D -> E -->
  <line x1="905" y1="180" x2="943" y2="180" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <!-- E -->
  <rect x="945" y="105" width="140" height="150" rx="10" fill="#fff" stroke="#d9dce1"/>
  <text x="959" y="130" font-size="12" fill="#7a828e">假设 E</text>
  <text x="959" y="156" font-size="15" font-weight="700" fill="#1d2430">动作进模型内部</text>
  <text x="959" y="180" font-size="12" fill="#4a5260">起点：V-JEPA 2-AC</text>
  <text x="959" y="198" font-size="12" fill="#4a5260">（机器人·单视角）</text>
  <rect x="959" y="214" width="72" height="22" rx="11" fill="#fdf1dc"/><text x="995" y="229" font-size="12" fill="#a0640f" text-anchor="middle">原则成立</text>

  <!-- ===== cross link: A3 -> D (same evidence) ===== -->
  <path d="M476,150 L505,150 L505,58 L825,58 L825,101" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <rect x="560" y="47" width="210" height="22" rx="11" fill="#fbfaf7"/>
  <text x="665" y="63" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">同一证据：推理-动作一致率 3–50%</text>

  <!-- ===== 线索二：F ===== -->
  <rect x="30" y="340" width="670" height="182" rx="12" fill="#fff" stroke="#5b6472" stroke-width="1.4"/>
  <g font-size="13" text-anchor="middle">
    <rect x="46" y="354" width="150" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-dasharray="5 3"/><text x="121" y="379" fill="#c0392b" font-weight="700">目标/代价（漏掉）</text>
    <rect x="206" y="354" width="150" height="40" rx="8" fill="#fff" stroke="#5b6472"/><text x="281" y="379" fill="#1d2430" font-weight="700">动作 → 后果预测</text>
    <rect x="366" y="354" width="150" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-dasharray="5 3"/><text x="441" y="379" fill="#c0392b" font-weight="700">闭环误差（漏掉）</text>
    <rect x="526" y="354" width="160" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-dasharray="5 3"/><text x="606" y="379" fill="#c0392b" font-weight="700">动作读出（漏掉）</text>
  </g>
  <text x="46" y="430" font-size="15" font-weight="700" fill="#1d2430">线索二（并行）· 假设 F：闭环 = 世界模型 + MPC</text>
  <rect x="410" y="414" width="96" height="22" rx="11" fill="#e1f2e7"/><text x="458" y="429" font-size="12" fill="#2f7d4f" text-anchor="middle">成立·需补全</text>
  <text x="46" y="456" font-size="13" fill="#4a5260">从具体闭环任务出发：多视角 · 速度 · 历史 · 目标 → 融合 → 动作候选 → 预测后果 → 选择</text>
  <rect x="46" y="474" width="640" height="32" rx="8" fill="#eef3fb" stroke="#2b5aa8" stroke-dasharray="2 3"/>
  <text x="62" y="495" font-size="13" fill="#2b5aa8">还没想好：目标怎么输入 · 动作怎么选 · 长期物体记忆 · 多视角在潜空间里怎么对齐</text>

  <!-- cross links into F -->
  <line x1="116" y1="200" x2="116" y2="350" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="126" y="288" font-size="12" fill="#c0392b" font-weight="700">域外证据（2D 导航）</text>
  <text x="126" y="305" font-size="12" fill="#c0392b">只换目标 26%→98%</text>

  <line x1="261" y1="200" x2="281" y2="350" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="290" y="288" font-size="12" fill="#c0392b" font-weight="700">他者会反应 →</text>
  <text x="290" y="305" font-size="12" fill="#c0392b">预测要以自车动作为条件</text>

  <path d="M800,257 C800,340 640,340 610,350" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="812" y="298" font-size="12" fill="#c0392b" font-weight="700">推理对，</text>
  <text x="812" y="315" font-size="12" fill="#c0392b">坏在解码器</text>

  <!-- ===== 汇合：G ===== -->
  <line x1="1015" y1="255" x2="1015" y2="338" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1005" y="292" font-size="12" fill="#4a5260" text-anchor="end">贡献：动作条件</text>
  <text x="1005" y="309" font-size="12" fill="#4a5260" text-anchor="end">+ JEPA 潜空间</text>
  <line x1="700" y1="400" x2="903" y2="400" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <text x="802" y="392" font-size="12" fill="#4a5260" text-anchor="middle">贡献：多视角输入 + 完整流程</text>

  <rect x="905" y="340" width="180" height="140" rx="10" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="921" y="365" font-size="12" fill="#7a828e">假设 G ⭐  汇合点</text>
  <text x="921" y="390" font-size="15" font-weight="700" fill="#1d2430">JEPA × 多视角</text>
  <text x="921" y="412" font-size="15" font-weight="700" fill="#1d2430">× 动作条件 × 闭环</text>
  <circle cx="1065" cy="360" r="11" fill="#c0392b"/><text x="1065" y="365" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">③</text>
  <text x="921" y="436" font-size="12" fill="#4a5260">核查后：缺口更窄</text>
  <rect x="921" y="448" width="58" height="22" rx="11" fill="#fdf1dc"/><text x="950" y="463" font-size="12" fill="#a0640f" text-anchor="middle">需收窄</text>

  <line x1="995" y1="480" x2="995" y2="508" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="905" y="510" width="180" height="56" rx="10" fill="#eef3fb" stroke="#b9c9e6"/>
  <text x="921" y="533" font-size="14" font-weight="700" fill="#1d2430">下一步</text>
  <text x="921" y="553" font-size="12" fill="#4a5260">先核实新颖性，再定命题</text>

  <!-- legend -->
  <g font-size="12" fill="#4a5260">
    <line x1="30" y1="598" x2="62" y2="598" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/><text x="70" y="602">推导 / 回应</text>
    <line x1="160" y1="598" x2="192" y2="598" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ad)"/><text x="200" y="602">证据或概念上的交叉关联</text>
    <circle cx="370" cy="598" r="9" fill="#c0392b"/><text x="370" y="602" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">①</text><text x="386" y="602">三次自我修正</text>
    <rect x="490" y="591" width="12" height="12" rx="3" fill="#e1f2e7"/><text x="508" y="602">成立</text>
    <rect x="550" y="591" width="12" height="12" rx="3" fill="#fdf1dc"/><text x="568" y="602">部分成立 / 需限定</text>
    <rect x="680" y="591" width="12" height="12" rx="3" fill="#eceef1"/><text x="698" y="602">未被证实</text>
    <rect x="770" y="591" width="12" height="12" rx="3" fill="#eef3fb" stroke="#2b5aa8" stroke-dasharray="2 2"/><text x="788" y="602">还没想好</text>
  </g>
</svg>
