<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="1000" height="560" rx="14" fill="#fbfaf7"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#1d2430">VLA 的断点：看懂了，但没做</text>

  <!-- top pipeline -->
  <text x="40" y="78" font-size="13" fill="#7a828e">当前 VLA：语言推理与动作头各自训练，中间没有一致性约束</text>
  <g text-anchor="middle">
    <rect x="40" y="94" width="240" height="84" rx="10" fill="#fff" stroke="#d9dce1"/>
    <text x="160" y="130" font-size="17" font-weight="700" fill="#1d2430">视觉编码</text><text x="160" y="156" font-size="13" fill="#4a5260">多帧图像 → token</text>
    <rect x="380" y="94" width="240" height="84" rx="10" fill="#fff" stroke="#d9dce1"/>
    <text x="500" y="130" font-size="17" font-weight="700" fill="#1d2430">语言推理（CoT）</text><text x="500" y="156" font-size="13" fill="#4a5260">“前方有人，应该停车”</text>
    <rect x="720" y="94" width="240" height="84" rx="10" fill="#fff" stroke="#c0392b" stroke-width="1.6"/>
    <text x="840" y="130" font-size="17" font-weight="700" fill="#1d2430">动作头 / 解码器</text><text x="840" y="156" font-size="13" fill="#4a5260">离散码本 → 轨迹</text>
  </g>
  <line x1="282" y1="136" x2="376" y2="136" stroke="#2f7d4f" stroke-width="3" marker-end="url(#g)"/>
  <text x="329" y="124" font-size="12" fill="#2f7d4f" text-anchor="middle">基本通</text>
  <line x1="622" y1="136" x2="660" y2="136" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="680" y1="136" x2="716" y2="136" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 5"/>
  <g stroke="#c0392b" stroke-width="3"><line x1="662" y1="126" x2="678" y2="146"/><line x1="678" y1="126" x2="662" y2="146"/></g>
  <text x="670" y="114" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">断点</text>

  <!-- stats -->
  <g>
    <rect x="40" y="206" width="290" height="110" rx="10" fill="#fff" stroke="#d9dce1"/>
    <text x="60" y="252" font-size="34" font-weight="800" fill="#c0392b">3–50%</text>
    <text x="60" y="280" font-size="14" fill="#1d2430">推理-动作全一致率</text>
    <text x="60" y="302" font-size="12" fill="#7a828e">KITScenes LongTail，10 个模型</text>

    <rect x="355" y="206" width="290" height="110" rx="10" fill="#fff" stroke="#d9dce1"/>
    <text x="375" y="252" font-size="34" font-weight="800" fill="#c0392b">37.9%</text>
    <text x="375" y="280" font-size="14" fill="#1d2430">声称停车，却继续行驶</text>
    <text x="375" y="302" font-size="12" fill="#7a828e">VLA 推理忠实性研究</text>

    <rect x="670" y="206" width="290" height="110" rx="10" fill="#fff" stroke="#d9dce1"/>
    <text x="690" y="252" font-size="34" font-weight="800" fill="#2f7d4f">8 / 10</text>
    <text x="690" y="280" font-size="14" fill="#1d2430">把推理里的动作抽出来执行，规划变好</text>
    <text x="690" y="302" font-size="12" fill="#7a828e">→ 推理是对的，坏在解码器</text>
  </g>

  <!-- bottom: AC -->
  <line x1="40" y1="346" x2="960" y2="346" stroke="#e3e5e9"/>
  <text x="40" y="378" font-size="15" font-weight="700" fill="#1d2430">另一种思路（V-JEPA 2-AC）：动作是预测器的输入条件，而不是外挂在后面的输出头</text>
  <g text-anchor="middle">
    <rect x="40" y="404" width="220" height="70" rx="10" fill="#eef3fb" stroke="#b9c9e6"/>
    <text x="150" y="436" font-size="16" font-weight="700" fill="#1d2430">潜状态 zₜ</text><text x="150" y="458" font-size="12" fill="#4a5260">冻结的 V-JEPA 编码器</text>
    <rect x="390" y="404" width="220" height="70" rx="10" fill="#2b5aa8"/>
    <text x="500" y="436" font-size="16" font-weight="700" fill="#fff">预测器 P(zₜ, aₜ)</text><text x="500" y="458" font-size="12" fill="#dbe6f7">在潜空间里想象后果</text>
    <rect x="740" y="404" width="220" height="70" rx="10" fill="#eef3fb" stroke="#b9c9e6"/>
    <text x="850" y="436" font-size="16" font-weight="700" fill="#1d2430">ẑₜ₊₁</text><text x="850" y="458" font-size="12" fill="#4a5260">与目标比较 → 选动作</text>
    <rect x="420" y="500" width="160" height="34" rx="17" fill="#fff" stroke="#2b5aa8"/>
    <text x="500" y="522" font-size="14" font-weight="700" fill="#2b5aa8">动作 aₜ</text>
  </g>
  <line x1="262" y1="439" x2="386" y2="439" stroke="#5b6472" stroke-width="2" marker-end="url(#k)"/>
  <line x1="612" y1="439" x2="736" y2="439" stroke="#5b6472" stroke-width="2" marker-end="url(#k)"/>
  <line x1="500" y1="500" x2="500" y2="478" stroke="#2b5aa8" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="960" y="545" font-size="12" fill="#a0640f" text-anchor="end">⚠️ 域：机器人操作 · 单视角 · 后训练变体</text>
</svg>
